[package]
name = "spare-parts"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tera = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tower-sessions = "0.12"
bcrypt = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["fs"] }
