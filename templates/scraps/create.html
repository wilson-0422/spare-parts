{% extends "base.html" %}

{% block title %}新建处置 - 备品备件管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h2>新建边角料处置</h2>
    <a href="/scraps" class="btn btn-secondary">返回列表</a>
</div>
{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}
<form method="POST" action="/scraps/create" class="form">
    <div class="form-group">
        <label for="material_id">选择原料</label>
        <select id="material_id" name="material_id" required>
            <option value="">请选择原料</option>
            {% for item in materials %}
            <option value="{{ item.material.id }}">{{ item.material.name }} ({{ item.material.specification }}) - 库存: {{ item.material.stock_quantity }}{{ item.material.unit }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="quantity">处置数量</label>
        <input type="number" id="quantity" name="quantity" step="0.01" min="0.01" required>
    </div>
    <div class="form-group">
        <label for="reason">处置原因</label>
        <textarea id="reason" name="reason" rows="3" required></textarea>
    </div>
    <div class="form-group">
        <label for="handler">处理人</label>
        <input type="text" id="handler" name="handler" required>
    </div>
    <button type="submit" class="btn btn-primary">提交</button>
</form>
{% endblock %}
