{% extends "base.html" %}

{% block title %}供应商详情 - 备品备件管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h2>供应商详情</h2>
    <a href="/suppliers" class="btn btn-secondary">返回列表</a>
</div>
<div class="detail-card">
    <div class="detail-row">
        <span class="detail-label">编号</span>
        <span class="detail-value">{{ supplier.id }}</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">名称</span>
        <span class="detail-value">{{ supplier.name }}</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">联系人</span>
        <span class="detail-value">{{ supplier.contact }}</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">电话</span>
        <span class="detail-value">{{ supplier.phone }}</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">地址</span>
        <span class="detail-value">{{ supplier.address }}</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">创建时间</span>
        <span class="detail-value">{{ supplier.created_at }}</span>
    </div>
</div>
<div class="detail-actions">
    <a href="/suppliers/{{ supplier.id }}/reconcile" class="btn btn-warning">供应商对账</a>
</div>
{% endblock %}
