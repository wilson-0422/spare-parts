{% extends "base.html" %}

{% block title %}编辑原料 - 备品备件管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h2>编辑原料</h2>
    <a href="/materials" class="btn btn-secondary">返回列表</a>
</div>
{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}
<form method="POST" action="/materials/{{ material.material.id }}/edit" class="form">
    <div class="form-group">
        <label for="name">名称</label>
        <input type="text" id="name" name="name" value="{{ material.material.name }}" required>
    </div>
    <div class="form-group">
        <label for="category">分类</label>
        <select id="category" name="category" required>
            <option value="轴承类" {% if material.material.category == "轴承类" %}selected{% endif %}>轴承类</option>
            <option value="紧固件" {% if material.material.category == "紧固件" %}selected{% endif %}>紧固件</option>
            <option value="板材" {% if material.material.category == "板材" %}selected{% endif %}>板材</option>
            <option value="线缆类" {% if material.material.category == "线缆类" %}selected{% endif %}>线缆类</option>
            <option value="密封件" {% if material.material.category == "密封件" %}selected{% endif %}>密封件</option>
            <option value="传动件" {% if material.material.category == "传动件" %}selected{% endif %}>传动件</option>
            <option value="电气件" {% if material.material.category == "电气件" %}selected{% endif %}>电气件</option>
            <option value="气动件" {% if material.material.category == "气动件" %}selected{% endif %}>气动件</option>
            <option value="过滤件" {% if material.material.category == "过滤件" %}selected{% endif %}>过滤件</option>
            <option value="管材" {% if material.material.category == "管材" %}selected{% endif %}>管材</option>
            <option value="其他" {% if material.material.category == "其他" %}selected{% endif %}>其他</option>
        </select>
    </div>
    <div class="form-group">
        <label for="specification">规格</label>
        <input type="text" id="specification" name="specification" value="{{ material.material.specification }}">
    </div>
    <div class="form-group">
        <label for="unit">单位</label>
        <input type="text" id="unit" name="unit" value="{{ material.material.unit }}" required>
    </div>
    <div class="form-group">
        <label for="stock_quantity">库存数量</label>
        <input type="number" id="stock_quantity" name="stock_quantity" value="{{ material.material.stock_quantity }}" step="0.01" min="0" required>
    </div>
    <div class="form-group">
        <label for="min_stock">安全库存</label>
        <input type="number" id="min_stock" name="min_stock" value="{{ material.material.min_stock }}" step="0.01" min="0" required>
    </div>
    <div class="form-group">
        <label for="price">单价(元)</label>
        <input type="number" id="price" name="price" value="{{ material.material.price }}" step="0.01" min="0" required>
    </div>
    <div class="form-group">
        <label for="supplier_id">供应商</label>
        <select id="supplier_id" name="supplier_id">
            <option value="">未指定</option>
            {% for s in suppliers %}
            <option value="{{ s.supplier.id }}" {% if material.material.supplier_id == s.supplier.id %}selected{% endif %}>{{ s.supplier.name }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">保存</button>
</form>
{% endblock %}
