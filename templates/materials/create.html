{% extends "base.html" %}

{% block title %}新增原料 - 备品备件管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h2>新增原料</h2>
    <a href="/materials" class="btn btn-secondary">返回列表</a>
</div>
{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}
<form method="POST" action="/materials/create" class="form">
    <div class="form-group">
        <label for="name">名称</label>
        <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
        <label for="category">分类</label>
        <select id="category" name="category" required>
            <option value="轴承类">轴承类</option>
            <option value="紧固件">紧固件</option>
            <option value="板材">板材</option>
            <option value="线缆类">线缆类</option>
            <option value="密封件">密封件</option>
            <option value="传动件">传动件</option>
            <option value="电气件">电气件</option>
            <option value="气动件">气动件</option>
            <option value="过滤件">过滤件</option>
            <option value="管材">管材</option>
            <option value="其他">其他</option>
        </select>
    </div>
    <div class="form-group">
        <label for="specification">规格</label>
        <input type="text" id="specification" name="specification">
    </div>
    <div class="form-group">
        <label for="unit">单位</label>
        <input type="text" id="unit" name="unit" required placeholder="如：个、张、米、台">
    </div>
    <div class="form-group">
        <label for="stock_quantity">库存数量</label>
        <input type="number" id="stock_quantity" name="stock_quantity" step="0.01" min="0" required>
    </div>
    <div class="form-group">
        <label for="min_stock">安全库存</label>
        <input type="number" id="min_stock" name="min_stock" step="0.01" min="0" required>
    </div>
    <div class="form-group">
        <label for="price">单价(元)</label>
        <input type="number" id="price" name="price" step="0.01" min="0" required>
    </div>
    <div class="form-group">
        <label for="supplier_id">供应商</label>
        <select id="supplier_id" name="supplier_id">
            <option value="">未指定</option>
            {% for s in suppliers %}
            <option value="{{ s.supplier.id }}">{{ s.supplier.name }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">提交</button>
</form>
{% endblock %}
